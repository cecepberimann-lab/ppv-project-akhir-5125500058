<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator IPK Simpel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar Navigation -->
  <nav class="navbar">
    <div class="logo">Kalkulator IPK</div>
    <div class="user-menu">
      <span id="user-greeting">Guest</span>
      <button id="auth-btn" onclick="handleAuthAction()">Login</button>
    </div>
  </nav>

  <!-- Container Utama -->
  <main class="container">
    
    <!-- Modal / Form Login Sederhana -->
    <div id="login-modal" class="modal hidden">
      <div class="modal-content">
        <h3>Masuk ke Akun</h3>
        <p>Masukkan nama kamu untuk menyimpan sesi IPK.</p>
        <input type="text" id="username-input" placeholder="Masukkan Nama / Username...">
        <div class="modal-actions">
          <button onclick="submitLogin()" class="btn-primary">Masuk</button>
          <button onclick="closeLoginModal()" class="btn-secondary">Batal</button>
        </div>
      </div>
    </div>

    <!-- Ringkasan Hasil IPK -->
    <section class="card summary-card">
      <h2>Ringkasan Hasil</h2>
      <div class="stats-grid">
        <div class="stat-box">
          <span class="stat-label">Total SKS</span>
          <span id="total-sks" class="stat-value">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">IPK Kamu</span>
          <span id="ipk-val" class="stat-value highlight">0.00</span>
        </div>
      </div>
    </section>

    <!-- Form & Tabel Matakuliah -->
    <section class="card">
      <div class="card-header">
        <h2>Daftar Mata Kuliah</h2>
        <button onclick="tambahBaris()" class="btn-primary">+ Tambah Matkul</button>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Mata Kuliah</th>
              <th>SKS</th>
              <th>Nilai Huruf</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="matkul-list">
            <!-- Baris mata kuliah akan ditambah secara dinamis via JS -->
          </tbody>
        </table>
      </div>

      <div class="card-footer">
        <button onclick="hitungIPK()" class="btn-success">Hitung IPK</button>
        <button onclick="resetData()" class="btn-danger">Reset Semua</button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
